workflows:
  devicelens-unsigned:
    name: DeviceLens 1.1 – unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Generate iOS project
        script: |
          xcodegen generate --spec DeviceLens/project.yml
      - name: Build iPhone app (no signing)
        script: |
          set -euo pipefail
          xcodebuild \
            -project DeviceLens/DeviceLens.xcodeproj \
            -scheme DeviceLens \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/DeviceLensDerived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build
      - name: Package IPA
        script: |
          set -euo pipefail
          app="$CM_BUILD_DIR/DeviceLensDerived/Build/Products/Release-iphoneos/DeviceLens.app"
          test -d "$app"
          mkdir -p "$CM_BUILD_DIR/DeviceLensPackage/Payload"
          cp -R "$app" "$CM_BUILD_DIR/DeviceLensPackage/Payload/"
          cd "$CM_BUILD_DIR/DeviceLensPackage"
          zip -q -r "$CM_BUILD_DIR/DeviceLens-1.1-unsigned.ipa" Payload
          unzip -t "$CM_BUILD_DIR/DeviceLens-1.1-unsigned.ipa"
    artifacts:
      - DeviceLens-1.1-unsigned.ipa
